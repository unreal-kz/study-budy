[project]
name = "study-buddy-server"
version = "0.1.0"
description = "Thin backend proxy for Study Buddy's AI Buddy feature"
requires-python = ">=3.12"
dependencies = [
    "fastapi>=0.141.1",
    "uvicorn[standard]>=0.54.0",
    "httpx>=0.28.1",
    "python-dotenv>=1.2.3",
]

[dependency-groups]
dev = [
    "pytest>=9.1.1",
    "pytest-asyncio>=1.4.0",
    "pytest-mock>=3.16.0",
]

[tool.pytest.ini_options]
asyncio_mode = "auto"
