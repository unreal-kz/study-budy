services:
  - type: web
    name: study-buddy-server
    runtime: python
    plan: free
    region: frankfurt
    rootDir: server
    buildCommand: uv sync --frozen --no-dev
    startCommand: uv run --no-dev uvicorn app.main:app --host 0.0.0.0 --port $PORT
    healthCheckPath: /health
    autoDeployTrigger: checksPass
    envVars:
      - key: OPENROUTER_API_KEY
        sync: false
      - key: APP_TOKEN
        sync: false
